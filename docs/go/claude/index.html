<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>打开 Claude</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .open[hidden] { display: none; }
    .open { display: block; margin-top: 30vh; padding: 18px 24px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 600; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <a class="open" id="open" hidden>打开</a>
  </main>
  <script>
    // 设计画布里的链接经过这里叫起 Claude 桌面端：?project=chan_…&thread=cmsg_…&name=串名
    // 只接受这两种 id 格式，拼出固定的 claude:// 地址，不做任意跳转。
    (function () {
      var q = new URLSearchParams(location.search);
      var project = q.get('project') || '';
      var thread = q.get('thread') || '';
      if (!/^chan_[A-Za-z0-9]{10,64}$/.test(project) || !/^cmsg_[A-Za-z0-9]{10,80}$/.test(thread)) return;
      var url = 'claude://claude.ai/code/project/' + project + '?thread=' + thread;
      var name = (q.get('name') || '').slice(0, 60);
      var btn = document.getElementById('open');
      btn.href = url;
      btn.textContent = name ? '打开设计串：' + name : '打开设计串';
      btn.hidden = false;
      location.href = url;
    })();
  </script>
</body>
</html>
