<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>打开 Claude</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .open[hidden] { display: none; }
    .open { display: block; margin-top: 30vh; padding: 18px 24px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 600; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <a class="open" id="open" hidden>打开</a>
  </main>
  <script>
    // 设计画布里的链接经过这里叫起 Claude 桌面端：?project=chan_…&thread=cmsg_…&name=串名
    // 只接受这两种 id 格式，拼出固定的 claude:// 地址，不做任意跳转。
    (function () {
      var q = new URLSearchParams(location.search);
      var project = q.get('project') || '';
      var thread = q.get('thread') || '';
      if (!/^chan_[A-Za-z0-9]{10,64}$/.test(project) || !/^cmsg_[A-Za-z0-9]{10,80}$/.test(thread)) return;
      var url = 'claude://claude.ai/code/project/' + project + '?thread=' + thread;
      var name = (q.get('name') || '').slice(0, 60);
      var btn = document.getElementById('open');
      btn.href = url;
      btn.textContent = name ? '打开设计串：' + name : '打开设计串';
      btn.hidden = false;
      // 失去焦点时不能马上关：Chrome 先弹「要打开 Claude 吗？」时页面也会失去焦点，
      // 这时关掉标签页会把那个确认框一起关掉，桌面端就打不开（10-29 串链接「弹一下就没了」）。
      // 改成：标签页被切到后台时关；或者失去焦点后又回到这一页（确认框点完、或从桌面端切回浏览器）时关。
      // 这个标签页是画布用新标签打开的、只有一条历史，浏览器允许脚本关闭；关不掉时按钮留着备用。
      var done = false;
      var blurred = false;
      function closeSoon() {
        if (done) return;
        done = true;
        setTimeout(function () { window.close(); }, 1000);
      }
      window.addEventListener('blur', function () { blurred = true; });
      window.addEventListener('focus', function () { if (blurred) closeSoon(); });
      document.addEventListener('visibilitychange', function () { if (document.hidden) closeSoon(); });
      location.href = url;
    })();
  </script>
</body>
</html>
