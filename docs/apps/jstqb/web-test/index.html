<!doctype html>
<!-- JSTQB 网页测试版入口：输口令后在浏览器里解密 app.bin，写进缓存，由 sw.js 在本目录的 app/ 下提供（只是轻量门槛，不是强保护） -->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>网页测试版</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main>
    <header>
      <h1>网页测试版</h1>
      <p id="build" class="note"></p>
    </header>
    <section>
      <form id="f">
        <p><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="密码" style="font-size:20px;padding:8px;width:10em"></p>
        <p><button type="submit" style="font-size:18px;padding:8px 20px">打开</button></p>
      </form>
      <p id="msg" class="note"></p>
    </section>
  </main>
  <script>
    const APP = new URL('app/', location.href).pathname;
    const CACHE = 'jstqb-web-test';
    const KEY = 'jstqbWebTestBuild';
    const msg = document.getElementById('msg');
    const buildLine = document.getElementById('build');
    let build = null;

    async function current() {
      const res = await fetch('build.json', { cache: 'no-store' });
      return (await res.json()).build;
    }

    async function ready() {
      try {
        if (localStorage.getItem(KEY) !== build) return false;
        const c = await caches.open(CACHE);
        const mark = await c.match(APP + '__build');
        // 和 sw.js 看同一个记号，两边判断一致，不会来回跳。
        return !!(await c.match(APP + 'index.html')) && !!mark && (await mark.text()) === build;
      } catch (_) {
        return false;
      }
    }

    async function download() {
      const res = await fetch('app.bin', { cache: 'no-store' });
      if (!res.ok) throw new Error('下载失败（' + res.status + '）');
      const total = Number(res.headers.get('content-length')) || 0;
      const reader = res.body.getReader();
      const parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        got += value.length;
        msg.textContent = '下载中… ' + (total ? Math.floor(got * 100 / total) + '%' : Math.floor(got / 1048576) + 'MB');
      }
      const data = new Uint8Array(got);
      let off = 0;
      for (const p of parts) { data.set(p, off); off += p.length; }
      return data;
    }

    async function install(buf, password) {
      msg.textContent = '解密中…';
      const s = crypto.subtle;
      const base = await s.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await s.deriveKey({ name: 'PBKDF2', salt: buf.slice(0, 16), iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      let zipped;
      try {
        zipped = await s.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.subarray(28));
      } catch (_) {
        return false;
      }
      const plain = new Uint8Array(await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
      const headLength = new DataView(plain.buffer).getUint32(0);
      const head = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + headLength)));
      const start = 4 + headLength;
      await caches.delete(CACHE);
      const c = await caches.open(CACHE);
      for (const [path, offset, length, type] of head.files) {
        const body = plain.slice(start + offset, start + offset + length);
        await c.put(APP + path, new Response(body, { headers: { 'Content-Type': type } }));
      }
      // 给 sw.js 看的版本记号：直接打开 app/ 时它拿这个和线上 build.json 比，旧了转回入口页。
      await c.put(APP + '__build', new Response(head.build));
      localStorage.setItem(KEY, head.build);
      return true;
    }

    async function open() {
      msg.textContent = '启动中…';
      // 不能等 serviceWorker.ready：它只等管着当前页（入口页）的那个，sw.js 只管 app/，会一直等下去。
      const reg = await navigator.serviceWorker.register('sw.js', { scope: APP });
      const worker = reg.installing || reg.waiting || reg.active;
      if (worker && worker.state !== 'activated') {
        await new Promise((done) => worker.addEventListener('statechange', () => { if (worker.state === 'activated') done(); }));
      }
      // 用 replace：入口页不留在浏览历史里，App 里侧滑返回不会退回密码页。
      location.replace(APP);
    }

    (async () => {
      try {
        build = await current();
        buildLine.textContent = '构建时间 ' + build;
      } catch (_) {
        buildLine.textContent = '读不到构建时间';
      }
      // 本机已有这一版就直接进 App，不再停在密码页。
      if (build && await ready() && 'serviceWorker' in navigator) await open();
    })();

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        if (!('serviceWorker' in navigator)) throw new Error('这个浏览器不支持（无痕模式可能关了 service worker）');
        if (!(build && await ready())) {
          const ok = await install(await download(), document.getElementById('pw').value);
          if (!ok) { msg.textContent = '密码不对'; return; }
        }
        await open();
      } catch (err) {
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
